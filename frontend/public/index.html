<!doctype html>
<html lang="hi">
    <head>
        <meta charset="utf-8" />
        <!-- viewport-fit=cover is what makes the env(safe-area-inset-*) values
             non-zero on notched phones; without it the fixed bottom navigation
             renders underneath the iPhone home indicator and its buttons cannot
             be tapped. maximum-scale is deliberately omitted so a low-vision
             citizen can still pinch-zoom (WCAG 1.4.4). -->
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <!-- Saffron, so the mobile status bar matches the app rather than
             showing a black band above a light interface. -->
        <meta name="theme-color" content="#FF9933" />
        <meta name="description" content="Nagarik Sahayak - find and apply for Indian government schemes in your language." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/

        Notice the use of %PUBLIC_URL% in the tags above. It will be replaced with
        the URL of the `public` folder during the build. Only files inside the
        `public` folder can be referenced from the HTML.
        -->
        <title>Nagarik Sahayak</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
